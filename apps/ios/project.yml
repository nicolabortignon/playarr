# XcodeGen spec for the Playarr app: `make bootstrap` (or any make target) generates Playarr.xcodeproj
# from this file. The .xcodeproj is not committed. Versions, team and bundle id: Config/Base.xcconfig.
name: Playarr
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  PlayarrAPI:
    path: Packages/PlayarrAPI
    group: Packages
  PlayarrPlayer:
    path: Packages/PlayarrPlayer
    group: Packages
  PlayarrUI:
    path: Packages/PlayarrUI
    group: Packages
  PlayarrWidgetData:
    path: Packages/PlayarrWidgetData
    group: Packages
targets:
  Playarr:
    type: application
    platform: iOS
    sources:
      - Playarr
      - path: Config
        buildPhase: none
    dependencies:
      - package: PlayarrUI
      - target: PlayarrWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PLAYARR_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Playarr.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # The widgets and the Feeling lucky control (plan 11), embedded in the app. It links PlayarrWidgetData only, and
  # compiles the app's playback intents as declarations (WIDGET_EXTENSION): the system performs them in the app.
  PlayarrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - PlayarrWidgets
      - path: Playarr/Intents/PlaybackIntents.swift
    dependencies:
      - package: PlayarrWidgetData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PLAYARR_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: PlayarrWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: PlayarrWidgets/PlayarrWidgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
  PlayarrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PlayarrUITests
    dependencies:
      - target: Playarr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PLAYARR_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Playarr:
    build:
      targets:
        Playarr: all
        PlayarrUITests: [test]
    test:
      config: Debug
      targets:
        - PlayarrUITests
    run:
      config: Debug
    archive:
      config: Release
