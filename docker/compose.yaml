# Playarr as a standalone service on the NAS (deployed by docker/deploy.mjs into /volume1/docker/playarr),
# at http://<nas>:4000. Settings come from .env next to this file: LIDARR_URL, LIDARR_API_KEY, MUSIC_DIR,
# and optionally PUBLIC_URL, TRUST_PROXY and SERVER_NAME, and for HTTPS at your own domain COMPOSE_PROFILES=https
# with PLAYARR_DOMAIN (see .env.example; empty when unset).
name: playarr

services:
  playarr:
    build:
      context: ./src
      dockerfile: docker/Dockerfile
    # By name, so update.sh can keep the image it replaces as playarr:previous and put it back as this one.
    image: playarr:latest
    container_name: playarr
    # Same user as the other containers here, so files in ./config and ./cache belong to you.
    user: "${PUID:-1000}:${PGID:-10}"
    init: true
    environment:
      LIDARR_URL: ${LIDARR_URL}
      LIDARR_API_KEY: ${LIDARR_API_KEY}
      # Music is mounted where Lidarr sees it, so its paths work as they are; reads stay inside it.
      PATH_MAP: /data/media/music=/data/media/music
      TZ: ${TZ:-Europe/London}
      UPDATE_DIR: /update
      # Behind a reverse proxy (e.g. https://tracklist.me): the address every client uses, and the
      # proxy to believe about the visitor. Empty means unset, as if the line weren't here.
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # HTTPS through Caddy (below): the domain it serves Playarr at. Unless PUBLIC_URL and TRUST_PROXY are set,
      # Playarr's address is then https://<domain>, and the only proxy it believes is Caddy, found by its name.
      PLAYARR_DOMAIN: ${PLAYARR_DOMAIN:-}
      SERVER_NAME: ${SERVER_NAME:-}
    volumes:
      - ${MUSIC_DIR}:/data/media/music:ro
      - ./config:/config # favorites, playlists, song analysis (keep)
      - ./cache:/cache # artwork and covers (safe to delete)
      - ./update:/update # Settings → Updates talks to the updater through this folder
      # Host folders for Settings → Sources → Folder → This server go under /host. Don't add them here
      # (update.sh replaces this file): put them in compose.override.yaml next to it, see
      # compose.override.example.yaml.
    ports:
      # The home network's way in. Never forward it on the router: through Docker's port mapping a visitor can look
      # like a home address, which matters before the owner has claimed the server. HTTPS goes through Caddy.
      - "4000:4000"
    # Healthy while /api/health answers with the database working (what update.sh waits for), not `ok`, which is false
    # whenever Lidarr or the music can't be reached. The timeout outlasts Lidarr's own 30 s, which the health route
    # waits on, and the start period leaves a start that migrates the database time to do it.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:4000/api/health | grep -qF '\"database\":{\"ok\":true'"]
      interval: 30s
      timeout: 45s
      retries: 3
      start_period: 5m
    restart: unless-stopped

  # HTTPS at your own domain (docs/server/https.md), only with COMPOSE_PROFILES=https in .env: Caddy answers on
  # ports 80 and 443, gets and renews a certificate for PLAYARR_DOMAIN from Let's Encrypt by itself, and hands every
  # request to Playarr over this project's network. Forward 80 and 443 on the router to this machine.
  # Named like its container rather than plain caddy: compose merges services of the same name, and a caddy of an
  # owner's own in compose.override.yaml must stay as it is.
  playarr-caddy:
    image: caddy:2
    container_name: playarr-caddy
    profiles: ["https"]
    environment:
      PLAYARR_DOMAIN: ${PLAYARR_DOMAIN:-}
    volumes:
      # The deployed commit's Caddyfile (update.sh replaces ./src); to use your own, mount it over this one in
      # compose.override.yaml.
      - ./src/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data # certificates and their keys (keep)
      - ./caddy/config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  # Settings → Updates: rebuilds Playarr from GitHub, its newest release or main, when asked (docker/updater.sh).
  # The only container with the Docker socket; it has no ports.
  updater:
    build:
      context: ./src
      dockerfile: docker/updater.Dockerfile
    image: playarr-updater:latest
    container_name: playarr-updater
    init: true
    environment:
      PLAYARR_DIR: ${PLAYARR_DIR:-/volume1/docker/playarr}
      PLAYARR_REPO: ${PLAYARR_REPO:-nicolabortignon/playarr}
      TZ: ${TZ:-Europe/London}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The deploy folder at the same path as on the host, so compose's relative paths stay right.
      - .:${PLAYARR_DIR:-/volume1/docker/playarr}
    restart: unless-stopped
