# The API the apps rely on. A push changes the server within 15 minutes, but copies of the iOS app from the App Store
# and of the TV app lag by weeks, so when the shared types, the server or an app change: each app's models must match
# the TypeScript types (Swift for iOS, Kotlin for the TV), every endpoint family the apps call is recorded afresh from
# the server's routes, and each app's contract tests decode what was recorded. A server change that would break apps
# already out there fails here. (docs/ios/conventions.md §4, "The server's side"; docs/ios/release.md says when to raise
# minAppVersion instead, and the same goes for the TV's minTvVersion.)
name: Contracts

on:
  push:
    paths: ['packages/**', 'apps/server/**', 'apps/ios/**', 'apps/tv/**', 'scripts/api-schema.mjs', '.github/workflows/contracts.yml']
  pull_request:
    paths: ['packages/**', 'apps/server/**', 'apps/ios/**', 'apps/tv/**', 'scripts/api-schema.mjs', '.github/workflows/contracts.yml']

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  # As ios.yml's.
  XCODE_VERSION: '26.6'

jobs:
  contracts:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: The Swift models match the TypeScript types
        run: node apps/ios/scripts/gen-models.mjs --check

      - name: Record the server's answers afresh
        run: RECORD_FIXTURES=1 pnpm -C apps/server exec vitest run src/routes/contract.test.ts

      - name: The app decodes them
        run: swift test --disable-sandbox --package-path apps/ios/Packages/PlayarrAPI --filter ContractTests

  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: The Kotlin models match the TypeScript types
        run: node apps/tv/scripts/gen-models.mjs --check

      - name: Record the server's answers afresh
        run: RECORD_FIXTURES=1 pnpm -C apps/server exec vitest run src/routes/contract.test.ts

      # The runner's Android SDK, with the platform the app compiles against (apps/tv/Makefile's SDK_PACKAGES).
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' > /dev/null

      - name: The TV app decodes them
        run: make -C apps/tv contracts
