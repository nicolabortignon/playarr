# The server, the web app and the shared packages: typecheck and tests for every push and pull request, whatever
# it changes, so every commit on main has a result the NAS's updater can go by (docs/server/updates-and-deploy.md).
# The web's smoke tests need a running server, so they're skipped here.
name: Server and web

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-web-${{ github.ref }}
  # On main every commit gets its result; elsewhere a newer push cancels the running one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # The check run's name: the NAS's updater installs a commit only once the run by this name has passed (docker/update.sh).
    name: Server and web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The Docker image's Node (docker/Dockerfile), so the tests run on what the NAS runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # Analysis, leveled streams and transitions run ffmpeg; tests that need the real one find it. busybox: the update
      # scripts' tests also run them with busybox's sh and tools, as in the updater's Alpine image.
      - name: Install ffmpeg and busybox
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg busybox

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: |
          pnpm -C packages/mix test
          pnpm -C apps/server test
          pnpm -C apps/web test
